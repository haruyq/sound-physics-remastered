modLoader = "javafml"
loaderVersion = "*"
license = "GPL"
[[mods]]
modId = "sound_physics_remastered"
version = "${mod_version}"
displayName = "Sound Physics Remastered (Sable Compat)"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/sound-physics-remastered"
logoFile = "icon.png"
authors = "Sonic Ether, vlad2305m, Max Henkel"
credits = "Sonic Ether, vlad2305m"
description = '''Provides realistic sound attenuation, reverberation, and absorption through blocks. Unofficial Sable compatibility build.'''
displayTest = "IGNORE_ALL_VERSION"
[[mixins]]
config = "sound_physics_remastered.mixins.json"
[[dependencies.sound_physics_remastered]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_dependency}"
ordering = "NONE"
side = "BOTH"
[[dependencies.sound_physics_remastered]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.1]"
ordering = "NONE"
side = "BOTH"
[[dependencies.sound_physics_remastered]]
modId = "cloth_config"
type = "optional"
versionRange = "[${cloth_config_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.sound_physics_remastered]]
modId = "voicechat"
type = "optional"
versionRange = "[1.21-2.4.11,)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.sound_physics_remastered]]
modId = "sable"
type = "optional"
versionRange = "[2.0.6,)"
ordering = "AFTER"
side = "CLIENT"
[[dependencies.sound_physics_remastered]]
modId = "sablecompanion"
type = "optional"
versionRange = "[1.6.0,2)"
ordering = "AFTER"
side = "CLIENT"
